<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>小朋友下樓梯 NS-SHAFT ONLINE ⚡ 經典復刻＋全服殘影排行榜</title>
  <link rel="stylesheet" href="style.css?v=3" />
</head>
<body>
  <div class="app-shell">
    <!-- Left / Center Game Column -->
    <div class="stage-wrapper">
      <!-- Classic Arcade Top Header -->
      <div class="hud-top">
        <div class="hud-life-box">
          <div class="hud-label-row">
            <span class="hud-label">LIFE</span>
            <span id="hudHpText" class="hud-hp-num">12 / 12</span>
          </div>
          <div id="lifeBars" class="life-bars"></div>
        </div>

        <div class="hud-floor-box">
          <div class="floor-display">地下 <span id="hudFloor">B001</span> 層</div>
          <span id="hudBestFloor" class="hud-sub">個人最高 B001 層</span>
        </div>

        <div class="hud-actions">
          <button id="btnSeedMode" class="btn-icon" title="切換同圖競技或隨機地圖">📅 同圖</button>
          <button id="btnRestart" class="btn-icon" title="重新開始 (快捷鍵 R 或空白鍵)">🔄</button>
          <button id="btnMute" class="btn-icon" title="經典音效開關">🔊</button>
        </div>
      </div>

      <!-- Main Shaft Canvas Container -->
      <div class="canvas-wrap">
        <canvas id="shaftCanvas" width="480" height="600"></canvas>

        <!-- Game Over Modal Overlay (Manual Upload + Save Image + LINE Share) -->
        <div id="gameOverModal" class="modal hidden">
          <div class="modal-box">
            <div id="modalCauseBadge" class="modal-badge">💀 踩到尖刺失血過多</div>
            <h2>啊～～～！你撐到了 <span id="modalFloor" class="accent-yellow">B042</span> 層</h2>
            <div id="modalTitleBadge" class="title-pill">🏅 獲得稱號：⚡ 電腦課風雲人物</div>

            <div class="modal-stats">
              <div class="stat-item">
                <span>最終層數</span>
                <strong id="modalFloorStat">B042</strong>
              </div>
              <div class="stat-item">
                <span>存活時間</span>
                <strong id="modalTimeStat">38.5s</strong>
              </div>
              <div class="stat-item">
                <span>全服排名</span>
                <strong id="modalRankStat" class="accent-cyan">未上傳</strong>
              </div>
            </div>

            <!-- Inline Name for Upload -->
            <div class="modal-inputs">
              <div class="modal-input-row">
                <label>暱稱</label>
                <input id="modalNameInput" type="text" maxlength="16" placeholder="輸入你的名字..." />
              </div>
            </div>

            <!-- Primary Action: Manual Upload to Leaderboard -->
            <button id="btnUploadScore" class="btn-upload">🚀 點擊上傳分數＆殘影到排行榜</button>

            <!-- Viral Share Row: Save Image Card + LINE Share + Copy Text -->
            <div class="share-grid">
              <button id="btnSaveImgModal" class="btn-img-card">📸 戰績圖</button>
              <button id="btnLineModal" class="btn-line">💬 LINE 找人PK</button>
              <button id="btnShareModal" class="btn-copy">🔗 複製連結</button>
            </div>

            <button id="btnRetryModal" class="btn-retry-wide">⚡ 再玩一場</button>
          </div>
        </div>
      </div>

      <!-- Share Card Preview (full screen so it is visible wherever the page is scrolled) -->
      <div id="imgPreviewModal" class="modal hidden">
        <div class="modal-box img-modal-box">
          <div class="img-modal-header">
            <strong>📸 戰績圖</strong>
            <button id="btnCloseImgModal" class="btn-close-x" aria-label="關閉">✕</button>
          </div>
          <img id="generatedCardImg" class="card-preview-img" alt="戰績圖卡" />
          <div class="modal-buttons">
            <button id="btnNativeShareImg" class="btn-primary">📤 分享圖片</button>
            <button id="btnDownloadPng" class="btn-copy">💾 存到裝置</button>
          </div>
          <p class="img-modal-tip">也可以長按圖片直接儲存</p>
        </div>
      </div>

      <!-- Mobile / Mouse Ergonomic Thumb Controls -->
      <div class="touch-controls">
        <button id="btnLeft" class="touch-btn">◀ 按住左移</button>
        <button id="btnRight" class="touch-btn">按住右移 ▶</button>
      </div>

      <div class="legend-bar">
        <span class="legend-item"><i class="plat-icon normal"></i>普通 (+1❤️)</span>
        <span class="legend-item"><i class="plat-icon spike"></i>尖刺 (-5❤️)</span>
        <span class="legend-item"><i class="plat-icon spring"></i>彈簧 (小跳)</span>
        <span class="legend-item"><i class="plat-icon conveyor"></i>輸送帶</span>
        <span class="legend-item"><i class="plat-icon fake"></i>翻轉門</span>
      </div>
    </div>

    <!-- Right Sidebar: Player Info + Live Global Leaderboard -->
    <aside class="sidebar">
      <div class="brand-header">
        <div>
          <h1>🏃 小朋友下樓梯</h1>
          <p class="brand-sub">NS-SHAFT // 1997 經典復刻全服連線版</p>
        </div>
        <span class="live-badge"><span class="pulse-dot"></span> LIVE</span>
      </div>

      <div class="player-box">
        <div class="input-group">
          <label for="playerName">玩家暱稱</label>
          <input id="playerName" type="text" maxlength="16" placeholder="輸入你的名字..." value="電腦課高手" />
        </div>
        <div class="ghost-row">
          <span id="ghostStatusLabel" class="ghost-status">👻 載入殘影中...</span>
          <label class="switch" title="顯示或隱藏殘影">
            <input type="checkbox" id="toggleGhost" checked />
            <span class="switch-track"></span>
          </label>
        </div>
      </div>

      <div class="global-stats">
        <div>全服場次：<strong id="statGames">--</strong></div>
        <div>全服最深：<strong id="statMaxFloor" class="accent-yellow">--</strong></div>
        <div>累積下樓：<strong id="statTotalFloors">--</strong> 層</div>
      </div>

      <div class="lb-header-row">
        <span class="lb-header">🏆 全服最深排行榜</span>
        <span class="lb-hint">按 👻PK 跟他的殘影一起跑</span>
      </div>
      <div id="leaderboardList" class="leaderboard-list">
        <div class="loading-text">載入排行榜中...</div>
      </div>

    </aside>
  </div>

  <div id="toast" class="toast hidden">已複製戰績到剪貼簿！</div>

  <script src="game.js?v=3"></script>
</body>
</html>
